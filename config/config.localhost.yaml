settings:
  default_timeout_seconds: 10
  slow_threshold_ms: 1500
  retries: 1
  retry_backoff_seconds: 1
  max_workers: 10
  output_dir: ./reports
  log_file: ./logs/monitor.log
  alert_cooldown_minutes: 60

# Automated Login Pre-flight Hook:
# Automatically logs in to obtain a Bearer token before running tests
auth_hook:
  enabled: true
  login_url: ${APP_BASE_URL:-http://localhost:8000}/api/login
  method: POST
  payload:
    username: ""
    email: ${LOGIN_EMAIL:-qloop@qloop.com}
    password: ${LOGIN_PASSWORD:-QLoopAdmin}
    remember_me: ""
  token_json_path: token
  auth_env: APP_BEARER_TOKEN

